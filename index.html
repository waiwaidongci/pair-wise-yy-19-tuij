<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>岩芯薄片视域拼接与孔隙率核验台</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="shell">
    <header class="mast">
      <div>
        <p>Thin Section Stitching &amp; Porosity Lab</p>
        <h1>岩芯薄片视域拼接与孔隙率核验台</h1>
      </div>
      <button id="exportBtn" type="button">导出核验档案</button>
    </header>

    <section class="layout">
      <form id="sampleForm" class="editor">
        <h2>样品资料</h2>
        <label>样品编号<input name="code" required placeholder="BX-17-03"></label>
        <label>采样地点<input name="location" placeholder="剖面东侧第二层"></label>
        <div class="pair">
          <label>放大倍数<input name="magnification" placeholder="40x"></label>
          <label>主要矿物<input name="minerals" placeholder="石英、斜长石"></label>
        </div>
        <label>颗粒结构<input name="texture" placeholder="半自形粒状、碎裂结构"></label>
        <label>批注<textarea name="comment" rows="3" placeholder="记录鉴定依据或疑点"></textarea></label>
        <button type="submit">保存样品</button>
      </form>

      <section class="board">
        <div class="filters">
          <input id="mineralFilter" placeholder="按矿物筛选">
          <select id="statusFilter">
            <option value="">全部状态</option>
            <option>拼版有效</option>
            <option>禁止拼接</option>
            <option>已失效</option>
            <option>未拼接</option>
          </select>
        </div>
        <div id="sampleGrid" class="sample-grid"></div>
      </section>

      <aside id="labPane" class="lab"></aside>
    </section>
  </main>
  <script src="./rules.js"></script>
  <script src="./store.js"></script>
  <script src="./app.js"></script>
</body>
</html>
